<!DOCTYPE html>
<html lang="en" class="h-full bg-[#050508]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050508" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Universal 3D Engineering Simulation Platform. Explore, inspect, disassemble, and analyze high-performance automotive and aerospace machinery in browser-based real-time 3D." />
    <title>AURA 3D — Universal Engineering Simulator Platform</title>

    <!-- DNS Prefetch & Preconnect for Fast Asset Loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Google MediaPipe Hands Neural AI for 21-joint finger tracking (deferred so DOM render is instant) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  </head>
  <body class="h-full bg-[#050508] text-[#F0F0F6] font-sans antialiased overflow-x-hidden selection:bg-red-600 selection:text-white">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
